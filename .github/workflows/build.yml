# Fork CI: the cores this branch changes, built where the buildbot would
name: build

on:
  workflow_dispatch:
  push:
    branches: [preflight-arm64]

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-x86_64
            runner: ubuntu-24.04
          - arch: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build
        run: make -C src -f Makefile.libretro -j$(nproc)
      - name: Check
        run: |
          file src/pcem_libretro.so
          nm -D --defined-only src/pcem_libretro.so | grep -c ' T retro_'
      - uses: actions/upload-artifact@v4
        with:
          name: pcem_libretro-${{ matrix.arch }}
          path: src/pcem_libretro.so
